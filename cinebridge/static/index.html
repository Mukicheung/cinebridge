<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f7f9" />
    <title>片桥 CineBridge</title>
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div id="login" class="login-screen" hidden>
      <div class="login-box">
        <img src="/static/icon.svg" width="48" height="48" alt="" />
        <p class="eyebrow">YOUR LIBRARY, CONNECTED</p>
        <h1>欢迎回到片桥。</h1>
        <p>把想看的电影，接到自己的片库。</p>
        <form id="login-form">
          <label for="access-key">本机访问密钥</label
          ><input
            id="access-key"
            type="password"
            autocomplete="current-password"
            required
            placeholder="粘贴安装时生成的访问密钥"
          /><button class="primary" type="submit">
            进入工作台 <span>→</span>
          </button>
        </form>
        <p class="small">
          忘记密钥？在部署终端运行 <code>cinebridge token</code><br />Docker
          部署：<code>docker compose exec cinebridge cinebridge token</code>
        </p>
        <div id="login-error" role="alert"></div>
      </div>
      <div class="login-art">
        <div class="film-ring"></div>
        <p>从一个「想看」<br />到你的私人片库。</p>
        <span>本地运行 · 自己的账号 · 自己的资源</span>
      </div>
    </div>
    <div id="shell" hidden>
      <aside class="sidebar">
        <a href="#overview" class="brand"
          ><img src="/static/icon.svg" width="34" height="34" alt="" /><span
            >片桥 <small>CineBridge</small></span
          ></a
        >
        <div class="workspace">
          <span class="status-dot"></span> 我的本地工作台
          <span class="version">0.1</span>
        </div>
        <p class="nav-label">工作空间</p>
        <nav id="nav"></nav>
        <div class="sidebar-bottom">
          <div class="privacy-mark">
            <span>◈</span>
            <div>连接你的服务<small>数据保存在本地</small></div>
          </div>
          <button id="logout" class="text-button">退出工作台 ↗</button>
        </div>
      </aside>
      <div class="workspace-main">
        <header class="topbar">
          <div class="breadcrumb">
            工作空间 <span>/</span> <strong id="crumb">概览</strong>
          </div>
          <div class="topbar-right">
            <span class="local-label"><i></i> 本地部署</span
            ><button id="quick-import" class="button small-button">
              ＋ 导入资源
            </button>
            <div class="avatar">C</div>
          </div>
        </header>
        <main id="content"></main>
        <footer>
          片桥 CineBridge <span>把片单、资源与片库连接起来。</span
          ><span>SELF-HOSTED & OPEN SOURCE</span>
        </footer>
      </div>
    </div>
    <dialog id="dialog"><div id="dialog-content"></div></dialog>
    <div id="toast" role="status" hidden></div>
    <script src="/static/app.js" defer></script>
  </body>
</html>
