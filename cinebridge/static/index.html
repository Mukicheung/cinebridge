<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#faf9f6" />
    <title>幕间 · 下一部，想看什么？</title>
    <meta name="application-name" content="CineBridge" />
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div id="shell">
      <header class="topbar">
        <a href="#search" class="brand" aria-label="幕间首页"
          ><img src="/static/icon.svg" width="32" height="32" alt="" /><span
            >幕间<small>MUJIAN</small></span
          ></a
        >
        <nav id="nav" aria-label="主导航"></nav>
        <div class="topbar-right">
          <button class="text-button" data-nav="subscriptions">豆瓣片单</button
          ><button
            class="settings-button"
            data-nav="connections"
            aria-label="设置与服务"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M4 17h16M8 4v6M16 14v6" />
            </svg>
          </button>
        </div>
      </header>
      <main id="content" aria-live="polite"></main>
      <footer>
        <a href="#setup">开始使用</a><span>少一点寻找，多一点好时光。</span
        ><button id="quick-import" class="text-button">
          导入种子 / 磁力 ↗
        </button>
      </footer>
    </div>
    <dialog id="dialog"><div id="dialog-content"></div></dialog>
    <div id="toast" role="status" hidden></div>
    <button id="download-dock" data-nav="tasks" hidden>
      <span class="dock-dot"></span><span id="dock-label">查看下载</span
      ><span>↗</span>
    </button>
    <script src="/static/app.js" defer></script>
  </body>
</html>
