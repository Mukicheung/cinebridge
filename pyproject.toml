[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cinebridge"
version = "0.3.0"
description = "A self-hosted bridge from watchlists to your media library"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "cryptography>=44", "grpcio>=1.70,<2", "protobuf>=5,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "grpcio-tools>=1.70,<2", "httpx2>=2"]

[project.scripts]
cinebridge = "cinebridge.cli:main"

[tool.setuptools.packages.find]
include = ["cinebridge*"]

[tool.setuptools.package-data]
cinebridge = ["static/*", "*.proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
